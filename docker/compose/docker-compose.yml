name: edgepilot

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: edgepilot
      POSTGRES_PASSWORD: edgepilot
      POSTGRES_DB: edgepilot
    # 本机 5432 已被本地 PostgreSQL 占用，这里映射到 5433；backend 默认值同步为 5433
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgepilot -d edgepilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ../mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: edgepilot
      RABBITMQ_DEFAULT_PASS: edgepilot
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # 应用服务仅在 --profile app 时启动；worker 复用 api 镜像。
  # build.context 相对本文件目录 docker/compose/，上两级即仓库根。
  api:
    image: edgepilot-api:local
    build:
      context: ../..
      dockerfile: docker/api.Dockerfile
    profiles: ["app"]
    environment:
      DATABASE_URL: postgresql+asyncpg://edgepilot:edgepilot@postgres:5432/edgepilot
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://edgepilot:edgepilot@rabbitmq:5672//
      MQTT_HOST: mosquitto
      MQTT_ENABLED: "true"
      OBS_ENABLED: "true"
      OBS_CAPTURE_MODE: REDACTED
      LLM_MODE: mock
      LLM_FIXTURE_DIR: demo/fixtures/llm
    # 演示夹具由 scripts/seed_workflow_demo.py 按真实事件生成；镜像不打包
    # demo 目录，开发栈只读挂载，避免把动态事件 id 固化进镜像。
    volumes:
      - ../../backend/demo/fixtures/llm:/app/backend/demo/fixtures/llm:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    image: edgepilot-api:local
    profiles: ["app"]
    command: ["celery", "-A", "app.worker", "worker", "-Q", "q.workflow,q.ingest,q.notify", "-c", "2"]
    environment:
      DATABASE_URL: postgresql+asyncpg://edgepilot:edgepilot@postgres:5432/edgepilot
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://edgepilot:edgepilot@rabbitmq:5672//
      MQTT_HOST: mosquitto
      OBS_ENABLED: "true"
      OBS_CAPTURE_MODE: REDACTED
      LLM_MODE: mock
      LLM_FIXTURE_DIR: demo/fixtures/llm
    volumes:
      - ../../backend/demo/fixtures/llm:/app/backend/demo/fixtures/llm:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Celery beat 负责审批超时扫描与僵死运行重投；与 worker 使用同一镜像与环境。
  scheduler:
    image: edgepilot-api:local
    profiles: ["app"]
    command:
      - celery
      - -A
      - app.worker
      - beat
      - -l
      - info
      - --schedule=/tmp/celerybeat-schedule
    environment:
      DATABASE_URL: postgresql+asyncpg://edgepilot:edgepilot@postgres:5432/edgepilot
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://edgepilot:edgepilot@rabbitmq:5672//
      MQTT_HOST: mosquitto
      OBS_ENABLED: "true"
      OBS_CAPTURE_MODE: REDACTED
      LLM_MODE: mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  mosquitto_data:
  rabbitmq_data:
